# Runs the pre-flight checks on every push and pull request.
#
# Deliberately NOT wired into Vercel's buildCommand: this repo deploys as a plain
# static site with functions, and giving it a build step risks the deploy path on
# a live revenue site to gain nothing a red check here does not already give.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-flight checks
        run: python scripts/check.py

      # The webhook's refund and dispute branches cannot be reached by clicking
      # through the site, so they are only ever covered here.
      - name: Webhook tests
        run: node tests/stripe-webhook.mjs

      # Same reason: the paths where the health check must NOT send an email,
      # and where it must not confuse a bad key with an unverified domain.
      - name: Health check tests
        run: node tests/health-resend.mjs

      # The kill switch's safety property is that an ABSENT variable closes
      # checkout. A regression to a convenience default would pass every manual
      # test and take money in production.
      - name: Payments kill switch tests
        run: node tests/payments-live.mjs

      # The corroboration behind the GST position on a tax invoice: a junk
      # header must not reach the record, and the browser must never be its
      # source.
      - name: GST declaration tests
        run: node tests/gst-declaration.mjs
